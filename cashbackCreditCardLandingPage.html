<script>
    var MMEHelp = {
        pollCount: 0,
        updateMainCTAButton: function () {
            var button = document.querySelector('.container button.btn-lime');
            button.innerHTML = 'Apply now';
        },
        updateModalCTAButton: function () {
            var button = document.querySelector('body > .fixed button.btn-lime');

            if (document.readyState === 'complete') MMEHelp.pollCount++;
            if ((button) || (document.readyState === 'complete' && MMEHelp.pollCount > 350)) {
                button.innerHTML = 'Apply now';
            } else {
                setTimeout(MMEHelp.updateModalCTAButton, 30);
            }
        },
        updateRestOfCTAButtons: function () {
            var buttons = document.querySelectorAll('button.btn-lime');

            if (buttons) {
                buttons.forEach(function (button) {
                    var buttonText = button.textContent.trim().toLowerCase();
                    if (buttonText === 'get started') {
                        button.classList.add('apply-btn-atc');
                        button.innerHTML = 'Apply now';
                    }
                });
            } else {
                setTimeout(MMEHelp.updateRestOfCTAButtons, 30);
            }
        },
        init: function () {
            if (window.location.pathname.indexOf('/credit-card/cashback-credit-card') !== -1) {
                MMEHelp.updateMainCTAButton();
                MMEHelp.updateRestOfCTAButtons();
                MMEHelp.updateModalCTAButton();
            }
        },
    };

    (function pollForMME() {
        if (window.MME) return false;
        var button = document.querySelector('.container button.btn-lime');
        if (button) {
            window.MME = {experiment: 'MME', variation: 'Variation 1', audience: 'All Devices', version: '1.0.01'};
            console.log(MME);
            MMEHelp.init();
            window.addEventListener('locationChange', function () {
                MMEHelp.init();
            });
        } else {
            setTimeout(pollForMME, 30);
        }
    })();
</script>
